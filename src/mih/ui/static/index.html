<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="referrer" content="no-referrer">
  <title>MIRTVONLINE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="На главную">
      <img src="icon.svg" alt="" width="28" height="28"><span>MIRTVONLINE</span>
    </a>
    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" name="q" autocomplete="off" enterkeyhint="search"
             placeholder="Что посмотреть? Например: новости вечером" aria-label="Поиск"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-history">
      <div id="search-history" class="history" role="listbox" aria-label="Прошлые поиски" hidden></div>
    </form>
    <nav class="tabs" aria-label="Разделы">
      <a href="#/" data-tab="home">Эфир</a>
      <a href="#/search" data-tab="search">Поиск</a>
      <a href="#/channels" data-tab="channels">Каналы</a>
      <a href="#/favorites" data-tab="favorites">Избранное</a>
      <a href="#/coverage" data-tab="coverage">Покрытие</a>
      <a href="#/status" data-tab="status">Статус</a>
      <a href="#/settings" data-tab="settings">Настройки</a>
    </nav>
  </header>
  <main id="view" tabindex="-1" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Для работы каталога нужен JavaScript.</noscript>
  <script src="app.js" defer></script>
</body>
</html>
