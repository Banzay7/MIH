<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c">
  <meta name="referrer" content="no-referrer">
  <title>MIRTVONLINE</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/" aria-label="На главную" data-i18n-aria-label="На главную">
      <img src="icon.svg" alt="" width="28" height="28"><span>MIRTVONLINE</span>
    </a>
    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" name="q" autocomplete="off" enterkeyhint="search"
             placeholder="Что посмотреть? Например: новости вечером" aria-label="Поиск"
             data-i18n-placeholder="Что посмотреть? Например: новости вечером" data-i18n-aria-label="Поиск"
             role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-history">
      <div id="search-history" class="history" role="listbox" aria-label="Прошлые поиски" data-i18n-aria-label="Прошлые поиски" hidden></div>
    </form>
    <nav class="tabs" aria-label="Разделы" data-i18n-aria-label="Разделы">
      <a href="#/" data-tab="home" data-i18n="Эфир">Эфир</a>
      <a href="#/search" data-tab="search" data-i18n="Поиск">Поиск</a>
      <a href="#/channels" data-tab="channels" data-i18n="Каналы">Каналы</a>
      <a href="#/favorites" data-tab="favorites" data-i18n="Избранное">Избранное</a>
      <a href="#/coverage" data-tab="coverage" data-i18n="Покрытие">Покрытие</a>
      <a href="#/status" data-tab="status" data-i18n="Статус">Статус</a>
      <a href="#/settings" data-tab="settings" data-i18n="Настройки">Настройки</a>
    </nav>
  </header>
  <main id="view" tabindex="-1" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>Для работы каталога нужен JavaScript.</noscript>
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</body>
</html>
