# MIRTVONLINE "На ТВ" for Android TV / Google TV through the Home Assistant Companion app.
# Paste into scripts.yaml, replace <device> with your TV's name in Home Assistant, then
# Developer tools -> YAML -> Check configuration and reload scripts. Server settings:
#   MIH_HA_SCRIPT=mih_play (the default)
#   MIH_HA_NOTIFY=notify.mobile_app_<device>
# No ADB: commands go to the Companion app on the TV as notification commands.
mih_play:
  alias: "MIRTVONLINE: channel on the TV"
  mode: restart
  fields:
    url:
      description: Stream URL (MIRTVONLINE sends the best one first)
    channel:
      description: Channel name
    notify_service:
      description: Companion notify action of the TV (MIH_HA_NOTIFY)
  variables:
    # Each Companion install registers its own notify.mobile_app_<device>; after a new
    # login in Companion the name can change and the old one disappears.
    notify_action: "{{ notify_service | default('notify.mobile_app_<device>', true) }}"
    # Companion sensor "Last used app" (enable it in Companion -> Manage sensors).
    app_sensor: sensor.<device>_last_used_app
    # Player that opens stream URLs; Just Player shown here.
    player: com.brouken.player
  sequence:
    # Open the stream and wait until the player is really in front, one retry.
    # No fixed 10-15 s delays: a typical start takes a few seconds.
    - repeat:
        sequence:
          - action: "{{ notify_action }}"
            data:
              message: command_activity
              data:
                intent_action: android.intent.action.VIEW
                intent_uri: "{{ url }}"
                intent_type: video/*
                intent_package_name: "{{ player }}"
          - wait_template: "{{ is_state(app_sensor, player) }}"
            timeout: "00:00:08"
        until: "{{ wait.completed or repeat.index >= 2 }}"
    - if: "{{ not is_state(app_sensor, player) }}"
      then:
        - variables:
            result:
              ok: false
              channel: "{{ channel }}"
              error: player did not open
        - stop: player did not open
          response_variable: result
    - action: "{{ notify_action }}"
      data:
        message: command_media
        data:
          media_command: play
          media_package_name: "{{ player }}"
    - delay: 1
    - variables:
        result:
          ok: true
          channel: "{{ channel }}"
          error: null
    - stop: started
      response_variable: result
