# MIRTVONLINE source catalog (draft, research 2026-10-26).
# Describes well-known public sources of channel metadata, EPG and public playlists.
# Nothing here is enabled by default; the user picks entries during onboarding.
# Playlists (kind m3u_playlist) are listed for their channel information. They import
# in metadata_only mode by default; taking their streams is a separate user opt-in.
# Every entry says what metadata it carries (see "metadata"). See README.md.
#
# Fields:
#   id             stable catalog id (never reused)
#   kind           provider_epg | tuner_eit | xmltv_aggregator | xmltv_fast | grabber | licensed_api | channel_db | m3u_playlist | playlist_tool
#   url_template   {cc}: upper-case ISO 3166-1 alpha-2 unless noted; {region}: source-specific name
#   variants       known values for the template placeholder
#   countries      ISO codes the entry is useful for ("*" = worldwide)
#   languages      ISO 639-1
#   id_scheme      what the XMLTV channel ids look like (affects mapping)
#   horizon_days   observed [past, future]
#   refresh        observed refresh, not a promise from the source
#   license        spdx id, "none" (no published licence), or "tos" (terms of service)
#   usage          personal | open | subscription
#   status_hint    ok | grey | down | retired : starting hint only, real status is measured per install
#   notes          known quirks
#   tied_to_stream_service  true when the EPG is published by or for an IPTV stream service
#
# Playlist-only fields (m3u_playlist, playlist_tool):
#   contains_streams  always true for playlists; shown to the user
#   metadata_level    rich | partial | none : the note the UI shows ("no metadata" for none)
#                     rich = tvg-id + logo + group on (almost) every entry, or EPG in the header
#   metadata          measured share of entries with tvg_id / tvg_logo / group_title,
#                     tvg_id scheme, and EPG url from the header (url-tvg / x-tvg-url)
#   entries           #EXTINF count when measured
#   measured          date of the measurement
#   health_checked    whether the publisher removes dead streams itself
#   derived_from      catalog id of the upstream list (for dedup; forks add little new info)
#   import_mode       default import mode: metadata_only (channels, ids, logos, groups, EPG link)

version: 2
updated: 2026-10-26

sources:

  # --- Automatic, from the user's own setup -------------------------------

  - id: provider-url-tvg
    kind: provider_epg
    name: "EPG from the playlist header (url-tvg / x-tvg-url)"
    url_template: null
    countries: ["*"]
    id_scheme: matches playlist tvg-id
    license: tos
    usage: personal
    status_hint: ok
    notes: Taken automatically from the M3U header. Highest mapping priority.

  - id: provider-xtream-xmltv
    kind: provider_epg
    name: "Xtream Codes provider XMLTV (xmltv.php)"
    url_template: "{base}/xmltv.php?username={user}&password={pass}"
    countries: ["*"]
    id_scheme: matches playlist tvg-id
    license: tos
    usage: personal
    status_hint: ok
    notes: Credentials are secrets; store via config_ref, never in the catalog or logs.

  - id: tvheadend-xmltv
    kind: tuner_eit
    name: "tvheadend XMLTV export (EIT from DVB tuner)"
    url_template: "http://{host}:9981/xmltv/channels"
    countries: ["*"]
    license: none
    usage: personal
    status_hint: ok
    notes: Private network address; needs allow_private_sources.

  # --- Public XMLTV aggregators -------------------------------------------

  - id: epgshare01
    kind: xmltv_aggregator
    name: "epgshare01 (EPG ripper, community)"
    url_template: "https://epgshare01.online/epgshare01/epg_ripper_{region}.xml.gz"
    # Variant list as referenced by the Free-TV/IPTV playlist header on 2026-10-26; may lag renames
    # (an article from 2026-09 already saw US2 and CA2 instead of US1 and CA1).
    variants: [AL1, AR1, AT1, AU1, BA1, BE2, BG1, BR1, CA1, CA2, CH1, CL1, CO1, CR1, CY1, CZ1, DE1, DK1, DO1, EC1, EG1, ES1, FI1, FR1, GR1, HK1, HR1, HU1, ID1, IE1, IL1, IN1, IN4, IT1, JM1, JP1, JP2, KE1, KR1, LT1, LV1, MT1, MX1, MY1, NG1, NL1, NO1, NZ1, PA1, PE1, PH1, PH2, PK1, PL1, PT1, RO1, RO2, RS1, SA1, SA2, SE1, SG1, SK1, SV1, TR1, TR3, UK1, US1, US2, US_LOCALS1, US_LOCALS2, US_SPORTS1, UY1, VN1, ZA1, ALJAZEERA1, BEIN1, PLEX1, DISTROTV1, RAKUTEN1, VOA1, ALL_SOURCES1]
    countries: [AL, AR, AT, AU, BA, BE, BG, BR, CA, CH, CL, CO, CR, CY, CZ, DE, DK, DO, EC, EG, ES, FI, FR, GB, GR, HK, HR, HU, ID, IE, IL, IN, IT, JM, JP, KE, KR, LT, LV, MT, MX, MY, NG, NL, NO, NZ, PA, PE, PH, PK, PL, PT, RO, RS, SA, SE, SG, SK, SV, TR, US, UY, VN, ZA]
    id_scheme: readable names with suffix, change on file rename
    horizon_days: [1, 3]
    refresh: daily
    license: none
    usage: personal
    status_hint: grey
    notes: >
      Variant names are approximate and change without notice (US1->US2, CA1->CA2 in 2026,
      every channel id changed). Some files are empty shells (PK, 310 bytes) or frozen
      (SA unchanged since 2024-08). ALL file is ~200 MB gz. US_LOCALS1 ~56 MB gz.

  - id: epg-pw
    kind: xmltv_aggregator
    name: "epg.pw"
    url_template: "https://epg.pw/xmltv/epg_{cc}.xml.gz"
    variants: [AU, BR, CA, CN, DE, FR, GB, HK, ID, IN, JP, MY, NZ, PH, RU, SG, TW, US, VN, ZA]
    countries: [AU, BR, CA, CN, DE, FR, GB, HK, ID, IN, JP, MY, NZ, PH, RU, SG, TW, US, VN, ZA]
    id_scheme: numeric (map by name only)
    horizon_days: [0, 7]
    refresh: daily
    license: none
    usage: personal
    status_hint: ok
    notes: >
      Site says "for testing purposes only" and data is "processed by AI". Dense 2-3 days,
      thin after. Also epg.xml.gz (all) and epg_lite.xml.gz. US file ~20 MB gz.

  - id: open-epg
    kind: xmltv_aggregator
    name: "Open-EPG"
    url_template: "https://www.open-epg.com/files/{region}.xml.gz"
    variants: [unitedkingdom, canada, unitedstates1, unitedstates2, unitedstates3, unitedstates4, unitedstates5, unitedstates6, unitedstates7, unitedstates8, unitedstates9, unitedstates10, unitedstates11]
    countries: [GB, US, CA]
    id_scheme: free text with spaces, brackets, commas
    horizon_days: [1, 2]
    refresh: daily
    license: none
    usage: personal
    status_hint: ok
    notes: >
      /files/ answers 302 even for missing files, so a probe must check the body,
      not the status code. More countries exist; variant list to be filled by the probe.

  - id: globetvapp
    kind: xmltv_aggregator
    name: "globetvapp/epg (GitHub)"
    url_template: "https://raw.githubusercontent.com/globetvapp/epg/main/{region}"
    variants: ["Australia/australia1.xml", "Unitedkingdom/unitedkingdom1.xml"]
    countries: ["*"]
    id_scheme: readable names
    refresh: "daily 03:00 UTC"
    license: GPL-3.0
    usage: open
    status_hint: ok
    notes: About 97 country folders. Licence covers the repository; rights to the listings themselves are unclear.

  - id: dp247-freeview
    kind: xmltv_aggregator
    name: "dp247 Freeview-EPG (UK FTA)"
    url_template: "https://raw.githubusercontent.com/dp247/Freeview-EPG/master/epg.xml"
    countries: [GB]
    languages: [en]
    refresh: every 12 h
    license: none
    usage: personal
    status_hint: ok
    notes: UK free-to-air TV and radio. Exact file path to be confirmed by the probe.

  - id: xmltvfr
    kind: xmltv_aggregator
    name: "xmltvfr.fr"
    url_template: "https://xmltvfr.fr/xmltv/xmltv.xml.gz"
    countries: [FR, BE, CH]
    languages: [fr]
    license: none
    usage: personal
    status_hint: ok
    notes: Strong for French channels; "complete" file is ~145 MB with little non-French coverage.

  - id: xmltv-net-au
    kind: xmltv_aggregator
    name: "xmltv.net (Australia)"
    url_template: "https://www.xmltv.net/xml_files/{region}.xml"
    countries: [AU]
    languages: [en]
    license: none
    usage: personal
    status_hint: grey
    notes: Mentioned by users, not verified; path pattern to be confirmed.

  # --- FAST channels -------------------------------------------------------

  - id: mjh-pluto
    kind: xmltv_fast
    name: "i.mjh.nz Pluto TV"
    url_template: "https://i.mjh.nz/PlutoTV/{cc_lower}.xml.gz"
