      Published by or for IPTV stream services. Rich and matching those services' tvg-ids.
      Shown with a "tied to an IPTV service" note. zuram.net is Moldovan channels.

  # --- Public playlists (contain streams) ---------------------------------------
  # Listed for their channel information. Default import is metadata_only.

  - id: iptv-org-playlists
    kind: m3u_playlist
    name: "iptv-org/iptv (by country, language, category, region)"
    url_template: "https://iptv-org.github.io/iptv/{group}/{code}.m3u"
    variants: ["index", "countries/{cc_lower}", "languages/{iso639_3}", "categories/{category}", "regions/{region}"]
    countries: ["*"]
    contains_streams: true
    metadata_level: rich
    metadata:
      tvg_id: "100% (vn 112/112, ru 700/703), iptv-org ids with feed suffix, e.g. 2x2.ru@SD"
      tvg_logo: "in generated playlists; not in raw streams/*.m3u"
      group_title: "in generated playlists"
      epg_header: none
    entries: "~11000 total; vn 112, ru 703 (raw streams files)"
    measured: 2026-10-26
    health_checked: false
    license: CC0-1.0
    usage: open
    import_mode: metadata_only
    status_hint: ok
    notes: >
      User-submitted links; the project no longer checks liveness. Entries carry
      [Geo-blocked] / [Not 24/7] labels in names. tvg-id joins directly to iptv-org-database.

  - id: free-tv
    kind: m3u_playlist
    name: "Free-TV/IPTV (free-to-air, curated)"
    url_template: "https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8"
    countries: ["*"]
    contains_streams: true
    metadata_level: rich
    metadata:
      tvg_id: "73% (1489/2052), epgshare01-style ids"
      tvg_logo: "94% (1939/2052)"
      group_title: "100%"
      epg_header: "x-tvg-url lists ~100 epgshare01 files"
    entries: 2052
    measured: 2026-10-26
    health_checked: true
    license: none
    usage: personal
    import_mode: metadata_only
    status_hint: ok
    notes: Only free-to-air channels by policy. Header is the best public map of current epgshare01 file names.

  - id: vn-all-in-one
    kind: m3u_playlist
    name: "All-In-One-IPTV (Vietnam, khanh71)"
    url_template: "https://raw.githubusercontent.com/khanh71/All-In-One-IPTV/main/{file}"
    variants: [http-iptv.m3u, iptv.m3u8]
    countries: [VN]
    languages: [vi]
    contains_streams: true
    metadata_level: rich
    metadata:
      tvg_id: "100% (76/76), vnepg short ids (vtv1hd)"
      tvg_logo: "100%"
      group_title: "100% (VTV, HTV/HTVC, regional north to south, ANTV/QPVN)"
      epg_header: "https://epg.io.vn/epg.xml (http-iptv.m3u), https://vnepg.site/epg.xml (iptv.m3u8)"
    entries: "76 / 78"
    measured: 2026-10-26
    health_checked: false
    refresh: "daily 01:00 ICT (GitHub Actions)"
    license: none
    usage: personal
    import_mode: metadata_only
    status_hint: ok
    notes: Streams are restreams of Vietnamese OTT services; best VN channel list with matching EPG ids.

