    countries: [US, GB, CA, DE, FR, ES, IT, IN, KR]
    id_scheme: opaque platform ids
    horizon_days: [0, 1]
    license: none
    usage: personal
    status_hint: ok

  - id: mjh-plex
    kind: xmltv_fast
    name: "i.mjh.nz Plex"
    url_template: "https://i.mjh.nz/Plex/{cc_lower}.xml.gz"
    variants: [us, gb, ca, au, nz, es, fr, mx]
    countries: [US, GB, CA, AU, NZ, ES, FR, MX]
    license: none
    usage: personal
    status_hint: ok

  - id: mjh-roku
    kind: xmltv_fast
    name: "i.mjh.nz The Roku Channel"
    url_template: "https://i.mjh.nz/Roku/all.xml.gz"
    countries: [US]
    license: none
    usage: personal
    status_hint: ok

  - id: mjh-au-freeview
    kind: xmltv_fast
    name: "i.mjh.nz Australia free-to-air by city"
    url_template: "https://i.mjh.nz/au/{region}/epg.xml.gz"
    variants: [Sydney, Melbourne, Brisbane, Perth, Adelaide, Hobart, Darwin, Canberra]
    countries: [AU]
    license: none
    usage: personal
    status_hint: ok

  # --- Self-hosted grabber ---------------------------------------------------

  - id: iptv-org-grabber
    kind: grabber
    name: "iptv-org/epg grabber (Docker sidecar)"
    url_template: "http://{host}:3000/guide.xml"
    countries: ["*"]
    license: Unlicense
    usage: open
    status_hint: ok
    notes: >
      ~251 broadcaster/operator sites, 248 green in SITES.md (tvprofil.com and tvtv.us broken,
      ziggogo.tv warning). Image ghcr.io/iptv-org/epg:master, default cron 00:00 UTC.
      Sites may block on high concurrency. Only way to first-party EPG for VN (xem.kplus.vn),
      JP, KR, Nordics. Prebuilt iptv-org.github.io/epg/guides/* is gone (404 since 2023).
    sites_by_country:
      VN: [xem.kplus.vn]
      RU: [ctc.ru, tv.mail.ru]
      KZ: [galamtv.kz]
      JP: [nhkworldpremium.com, www3.nhk.or.jp, ntv.co.jp, s.mxtv.jp, skyperfectv.co.jp, tvguide.myjcom.jp, www.tv-tokyo.co.jp]
      KR: [berrymedia.co.kr, ena.skylifetv.co.kr, mediagenie.co.kr, m.tving.com, skylife.co.kr, wavve.com]
      CN: [tv.cctv.com]
      TH: [gigatv.3bbtv.co.th, tv.trueid.net]
      ID: [mncvision.id, moji.id, tivie.id, visionplus.id]
      IN: [airtelxstream.in, dishtv.in, jiotv.com, tataplay.com]
      TR: [digiturk.com.tr, dsmart.com.tr, tvplus.com.tr, turksatkablo.com.tr]
      DE: [web.magentatv.de, www.magenta.tv]
      FR: [canalplus.com, chaines-tv.orange.fr, france.tv, guidetnt.com, programme-tv.net, tv.sfr.fr, tvcesoir.fr, tv-programme.telecablesat.fr]
      GB: [freeview.co.uk, mytelly.co.uk, player.ee.co.uk, sky.com, tv24.co.uk, virgintvgo.virginmedia.com]
      ES: [movistarplus.es, orangetv.orange.es, programacion-tv.elpais.com]
      IT: [guidatv.sky.it, mediasetinfinity.mediaset.it, raiplay.it, superguidatv.it]
      NL: [tvgids.nl, webtv.delta.nl, ziggogo.tv]
      SE: [allente.se, tv.nu, tv24.se]
      NO: [allente.no, rikstv.no]
      FI: [allente.fi, dna.fi, telsu.fi]
      DK: [allente.dk]
      BR: [claro.com.br, clarotvmais.com.br, vivoplay.com.br]
      AR: [directv.com.ar, reportv.com.ar]
      US: [tvguide.com, zap2it.com, tvpassport.com, directv.com, pluto.tv, plex.tv, xumo.tv, distro.tv]
      CA: [watch.sportsnet.ca, tvhebdo.com]
      AU: [abc.net.au, foxtel.com.au, foxsports.com.au]
      MENA: [aljazeera.com, bein.com, osn.com, shahid.mbc.net, rotana.net, elcinema.com]
      IL: [yes.co.il, mako.co.il, 9tv.co.il]
      ZA: [dstv.com]

  # --- Licensed ------------------------------------------------------------

  - id: schedules-direct
    kind: licensed_api
    name: "Schedules Direct (Gracenote data)"
    url_template: "https://json.schedulesdirect.org/20141201/"
    countries: [US, CA]
    horizon_days: [0, 14]
    refresh: daily
    license: tos
    usage: subscription
    status_hint: ok
    notes: >
      USD 35/year or 9 per 2 months, natural persons only, data only for Approved
      Applications. MIH must be accepted as an approved app before offering this.
      More data regions exist; list to be confirmed.

  # --- Channel identity (no EPG) --------------------------------------------

  - id: iptv-org-database
    kind: channel_db
    name: "iptv-org database / API"
    url_template: "https://iptv-org.github.io/api/{file}.json"
    variants: [channels, feeds, logos, guides, categories, languages, countries, subdivisions, cities, regions, timezones, blocklist]
    countries: ["*"]
    license: CC0-1.0
    usage: open
    status_hint: ok
    notes: >
      Identity reference only (D-04). streams.json is deliberately not used.
      guides.json maps channels to grabber sites and helps choose iptv-org-grabber sites.

  - id: wikidata
    kind: channel_db
    name: "Wikidata (television channels)"
    url_template: "https://query.wikidata.org/sparql"
    countries: ["*"]
    license: CC0-1.0
    usage: open
    status_hint: ok
    notes: Optional enrichment for networks, owners, native-language names and logos.


  - id: lyngsat-kingofsat
    kind: channel_db
    name: "LyngSat / KingOfSat (satellite channel listings)"
    url_template: "https://www.lyngsat.com/"
    countries: ["*"]
    license: none
    usage: personal
    status_hint: ok
    notes: HTML pages only, no API or published licence. Useful for satellite packages and frequencies; scraping only.

  # --- More XMLTV: regional and community -------------------------------------

  - id: vn-epg-io
    kind: xmltv_aggregator
    name: "epg.io.vn (Vietnam, vnepg ids)"
    url_template: "https://epg.io.vn/epg.xml"
    countries: [VN]
    languages: [vi]
    id_scheme: vnepg short ids (vtv1hd, htv7hd)
    license: none
    usage: personal
    status_hint: grey
    notes: Found in the All-In-One-IPTV playlist header. Not probed yet. Ids match that playlist.

  - id: vn-vnepg-site
    kind: xmltv_aggregator
    name: "vnepg.site (Vietnam)"
    url_template: "https://vnepg.site/epg.xml"
    countries: [VN]
    languages: [vi]
    id_scheme: vnepg short ids
    license: none
    usage: personal
    status_hint: grey
    notes: Second VN EPG referenced by All-In-One-IPTV (iptv.m3u8). Not probed yet.

  - id: tdtchannels-epg
    kind: xmltv_aggregator
    name: "TDTChannels EPG (Spain)"
    url_template: "https://www.tdtchannels.com/epg/TV.xml.gz"
    countries: [ES]
    languages: [es, ca, eu, gl]
    license: tos
    usage: personal
    status_hint: ok
    notes: Repository is Apache-2.0; hosted files fall under the site's legal notice. Radio EPG at ondachannels.com/epg/RADIO.xml.gz.

  - id: cn-fanmingming-epg
    kind: xmltv_aggregator
