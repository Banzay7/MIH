    license: none
    usage: personal
    status_hint: ok

  - id: mjh-samsung
    kind: xmltv_fast
    name: "i.mjh.nz Samsung TV Plus"
    url_template: "https://i.mjh.nz/SamsungTVPlus/{cc_lower}.xml.gz"
