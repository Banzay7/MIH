    url_template: "https://live.fanmingming.cn/e.xml"
    countries: [CN]
    languages: [zh]
    license: none
    usage: personal
    status_hint: grey
    notes: Referenced by the fanmingming/live playlist header. Availability outside CN not verified.

  - id: cn-yang-epg
    kind: xmltv_aggregator
    name: "iptv.yang-1989.xyz EPG (China)"
    url_template: "https://iptv.yang-1989.xyz/epg.xml.gz"
    countries: [CN, HK, TW]
    languages: [zh]
    license: none
    usage: personal
    status_hint: grey
    notes: Referenced by the YanG-1989/m3u playlist header.

  - id: cn-51zmt-epg
    kind: xmltv_aggregator
    name: "epg.51zmt.top (China)"
    url_template: "http://epg.51zmt.top:8000/e.xml"
    countries: [CN]
    languages: [zh]
    license: none
    usage: personal
    status_hint: grey
    notes: Community source, non-standard port, availability outside CN unverified.

  - id: ru-iptvx-one
    kind: xmltv_aggregator
    name: "iptvx.one EPG (RU/CIS)"
    url_template: "https://iptvx.one/epg/{region}.xml.gz"
    variants: [epg, epg_lite]
    countries: [RU, BY, UA, KZ]
    languages: [ru]
    horizon_days: [7, 7]
    license: none
    usage: personal
    status_hint: grey
    notes: Times in +0300. Full file has categories and logos; lite has titles only.

  - id: ru-teleguide
    kind: xmltv_aggregator
    name: "teleguide.info (RU)"
    url_template: "http://www.teleguide.info/download/new3/xmltv.xml.gz"
    countries: [RU]
    languages: [ru]
    license: none
    usage: personal
    status_hint: grey
    notes: Weekly schedule with descriptions. Plain HTTP.

  - id: ru-programtv
    kind: xmltv_aggregator
    name: "programtv.ru (RU)"
    url_template: "http://programtv.ru/xmltv.xml.gz"
    countries: [RU]
    languages: [ru]
    license: none
    usage: personal
    status_hint: grey
    notes: Times in +0300. Plain HTTP.

  - id: ru-provider-epgs
    kind: xmltv_aggregator
    name: "RU IPTV-service EPGs (it999/edem, ottclub, shara-tv, cbilling and others)"
    url_template: null
    variants:
      - "http://epg.it999.ru/edem.xml.gz"
      - "http://epg.it999.ru/epg2.xml.gz"
      - "http://myott.top/api/epg.xml.gz"
