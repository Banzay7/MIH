      - "http://st.kineskop.tv/epg.xml.gz"
      - "http://epg.cineman.fun/epg/epg_cineman.xml.gz"
      - "http://epg.zuram.net/xmltv.xml.gz"
    countries: [RU, BY, UA, KZ, MD]
    languages: [ru]
    license: none
    usage: personal
    tied_to_stream_service: true
    status_hint: grey
